name: Deploy Owner Dashboard
on:
  push:
    branches: [main]
    paths:
      - "owner-dashboard/**"
      - ".github/workflows/deploy-owner-dashboard.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: owner-dashboard-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: owner-dashboard
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
