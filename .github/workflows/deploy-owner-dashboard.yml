name: Deploy Owner Dashboard
on:
  push:
    branches: [main]
    paths:
      - "owner-dashboard/**"
      - ".github/workflows/deploy-owner-dashboard.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: owner-dashboard-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: owner-dashboard
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published dashboard
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-delay 10 --retry-all-errors "$SITE_URL" -o /tmp/owner-dashboard.html
          grep -q "Owner sign in" /tmp/owner-dashboard.html
          grep -q "PRIVATE OWNER CONSOLE" /tmp/owner-dashboard.html
          grep -q "System Monitoring" /tmp/owner-dashboard.html
          grep -q "Run check now" /tmp/owner-dashboard.html
          grep -q "Platform Overview" /tmp/owner-dashboard.html
          grep -q "refresh-overview" /tmp/owner-dashboard.html
          grep -q "owner-analytics" /tmp/owner-dashboard.html
          echo "Owner Dashboard is live with System Monitoring and Overview analytics."
