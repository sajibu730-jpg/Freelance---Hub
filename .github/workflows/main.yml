name: Android Build

# Manual APK build and verification after backend key migration.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        env:
          FREELANCE_HUB_API_URL: https://imffbmwdlenhmhxopwoq.supabase.co
          FREELANCE_HUB_PROJECT_ID: imffbmwdlenhmhxopwoq
          FREELANCE_HUB_SUPABASE_ANON_KEY: ${{ secrets.FREELANCE_HUB_SUPABASE_ANON_KEY }}
        run: gradle assembleDebug :owner-console:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Freelance-Hub-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Owner Dashboard APK
        uses: actions/upload-artifact@v4
        with:
          name: Freelance-Hub-Owner-Dashboard-apk
          path: owner-console/build/outputs/apk/debug/*.apk

  postgres-draft-tests:
    name: Isolated PostgreSQL draft tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: freelance_hub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d freelance_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run isolated PostgreSQL draft tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: freelance_hub_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql --version
          psql -v ON_ERROR_STOP=1 -f tests/sql/freelancer-reviews-postgres-test.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/jobs-proposals-workflow-postgres-test.sql
