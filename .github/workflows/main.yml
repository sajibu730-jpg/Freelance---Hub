name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Restore Source and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract Kotlin source files
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="Freelance_Hub_v55_900_FINAL_READINESS_HARDENED.zip"
          test -f "$ARCHIVE"
          mkdir -p /tmp/freelance-source
          unzip -q "$ARCHIVE" -d /tmp/freelance-source
          SOURCE="/tmp/freelance-source/app/src/main/java"
          test -f "$SOURCE/com/freelancehub/app/MainActivity.kt"
          mkdir -p app/src/main/java
          cp -R "$SOURCE"/. app/src/main/java/
          echo "Kotlin files restored:"
          find app/src/main/java -type f -name '*.kt' | wc -l

      - name: Commit restored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          if ! git diff --cached --quiet; then
            git commit -m "Restore Freelance Hub Kotlin source files"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Freelance-Hub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
